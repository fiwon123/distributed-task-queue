<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distributed Task Queue — API docs</title>
    <!--
      Swagger UI (swagger-ui-dist, pinned) is vendored under docs/swagger/ and
      served by this process at /swagger/, so this page needs no internet access.
      The spec it renders is served by this same process at /openapi.json.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/swagger/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/swagger/favicon-16x16.png"
    />
    <link rel="stylesheet" href="/swagger/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #fafafa;
      }
      #swagger-ui {
        max-width: 1100px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script src="/swagger/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    </script>
  </body>
</html>
