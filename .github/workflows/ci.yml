name: CI

# Go CI for this project. Adapted from the engineering-workflow library's
# `ci.go.yml.template`, flattened to a single module at the repo root (the
# template parameterizes a `<component-directory>`; here the module root is `.`).
# Toolchain: the Go gates (gofmt, vet, test, build) plus the web dashboard
# (oxlint, oxfmt, vitest, vite build).
#
# Action majors are pinned deliberately. Bump them as a reviewed change:
#   actions/checkout    v7
#   actions/setup-go    v5
#   actions/setup-node  v7
# checkout v7 requires runner >= v2.327.1. On a self-hosted runner older than
# that, these steps fail with an opaque error rather than a version complaint.

on:
  pull_request:
    branches: [main]
    paths:
      # Keep these in sync with the module layout. A hardcoded path here that
      # the project does not use makes the workflow valid but never triggered --
      # a silent no-op CI. A `paths:` filter means a change touching nothing
      # listed does not trigger CI at all, and a triggered run whose jobs are all
      # gated out reports `skipped`, not `passed`. Skipped is not passed: neither
      # outcome verifies a change, so run `make check` locally before relying on
      # CI.
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  go-check:
    name: Go + web (fmt, vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin a version here once `go.mod` exists (e.g. `go-version-file: go.mod`)
          # so CI and local development agree on the toolchain.
          go-version: "stable"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web (oxlint)
        working-directory: web
        run: npm run lint

      - name: Check web formatting (oxfmt)
        working-directory: web
        run: npm run format:check

      - name: Test web (vitest)
        working-directory: web
        run: npm run test

      - name: Build web dashboard
        working-directory: web
        run: npm run build

      # web/dist is committed so `go build` needs no Node. Fail if a source
      # change was not accompanied by a rebuilt bundle.
      - name: Dashboard bundle is up to date
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "web/dist is stale relative to web/src. Run 'make web-build' and commit the result."
            git diff --stat -- web/dist
            exit 1
          fi

      - name: Check Go formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
