name: CI

# Go CI for this project. Adapted from the engineering-workflow library's
# `ci.go.yml.template`, flattened to a single module at the repo root (the
# template parameterizes a `<component-directory>`; here the module root is `.`).
# Toolchain: the Go gates (gofmt, vet, test, build) plus the frontend dashboard
# (oxlint, oxfmt, vitest, vite build). A second job (`stack`) builds the runtime
# Docker image and runs the full stack end to end.
#
# Action majors are pinned deliberately. Bump them as a reviewed change:
#   actions/checkout    v7
#   actions/setup-go    v7
#   actions/setup-node  v7
# checkout v7 requires runner >= v2.327.1. On a self-hosted runner older than
# that, these steps fail with an opaque error rather than a version complaint.

on:
  pull_request:
    branches: [main]
    paths:
      # Keep these in sync with the module layout. A hardcoded path here that
      # the project does not use makes the workflow valid but never triggered --
      # a silent no-op CI. A `paths:` filter means a change touching nothing
      # listed does not trigger CI at all, and a triggered run whose jobs are all
      # gated out reports `skipped`, not `passed`. Skipped is not passed: neither
      # outcome verifies a change, so run `make check` locally before relying on
      # CI.
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "docs/**"
      - "scripts/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  go-check:
    name: Go + web (fmt, vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin a version here once `go.mod` exists (e.g. `go-version-file: go.mod`)
          # so CI and local development agree on the toolchain.
          go-version: "stable"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting (oxfmt)
        working-directory: frontend
        run: npm run format:check

      - name: Test frontend (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build frontend dashboard
        working-directory: frontend
        run: npm run build

      # frontend/dist is committed so `go build` needs no Node. Fail if a source
      # change was not accompanied by a rebuilt bundle.
      - name: Dashboard bundle is up to date
        run: |
          if ! git diff --quiet -- frontend/dist; then
            echo "frontend/dist is stale relative to frontend/src. Run 'make frontend-build' and commit the result."
            git diff --stat -- frontend/dist
            exit 1
          fi

      - name: Check Go formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  # Build the runtime image and exercise the whole application the way a user
  # runs it: Postgres + API + worker via the `prod` compose profile, seed the
  # demo jobs, and verify the worker drains them to `completed`/`dead`. This is
  # the only job that actually builds the Dockerfile, so it is what verifies the
  # `runtime` stage and docker-compose wiring. Because every app service is gated
  # behind a profile, the `prod` profile does not build the heavy dev sandbox
  # image.
  stack:
    name: Docker stack (build, run, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose --profile prod up -d --build

      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v1/queues >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          docker compose --profile prod logs
          exit 1

      - name: Seed demo jobs
        run: ./scripts/demo.sh

      # The demo enqueues two `echo` jobs and one `sleep` job (all complete) plus
      # one `fail` job with max_attempts=2 (retries once, then dead-letters).
      - name: Wait for the worker to drain the demo jobs
        run: |
          base=http://localhost:8080
          for _ in $(seq 1 30); do
            completed=$(curl -fsS "$base/v1/jobs?status=completed&limit=500" | grep -o '"count":[0-9]*' | cut -d: -f2)
            dead=$(curl -fsS "$base/v1/jobs?status=dead&limit=500" | grep -o '"count":[0-9]*' | cut -d: -f2)
            echo "completed=${completed:-0} dead=${dead:-0}"
            if [ "${completed:-0}" -ge 3 ] && [ "${dead:-0}" -ge 1 ]; then
              echo "worker processed the demo jobs"
              exit 0
            fi
            sleep 2
          done
          echo "demo jobs were not processed in time" >&2
          exit 1

      - name: Stack status
        if: always()
        run: |
          curl -fsS http://localhost:8080/v1/queues || true
          echo
          docker compose --profile prod ps || true
          docker compose --profile prod logs api worker || true

      - name: Tear down
        if: always()
        run: docker compose --profile prod down -v
