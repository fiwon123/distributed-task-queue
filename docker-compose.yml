# Compose file — base dev stack runs standalone on any OS.
#
# Host-only mounts (gh/opencode/gitconfig) live in docker-compose.agent.yml
# merged only when a Linux opencode binary exists. Invoked via /bin/bash.
name: ${PROJECT_NAME:-distributed-task-queue}

x-dev-image: &dev-image
  context: .
  dockerfile: Dockerfile
  target: dev
  args:
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=taskqueue
      - POSTGRES_DB=taskqueue
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskqueue -d taskqueue"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://taskqueue@db:5432/taskqueue?sslmode=disable
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/queues"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: ["dev", "prod"]
    entrypoint: ["/usr/local/bin/worker"]
    command:
      - "-queues"
      - "default"
      - "-concurrency"
      - "4"
      - "-poll-interval"
      - "500ms"
      - "-lease"
      - "30s"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://taskqueue@db:5432/taskqueue?sslmode=disable
    restart: unless-stopped

  dev:
    build: *dev-image
    image: ${DEV_IMAGE:-distributed-task-queue-dev}
    profiles: ["dev"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/bash", "./scripts/dev-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8081}:8080"
    environment:
      - DATABASE_URL=postgres://taskqueue@db:5432/taskqueue?sslmode=disable
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - HOME=/home/devuser
      - GOPATH=/workspace/.go
      - GOCACHE=/workspace/.go/cache
      - XDG_DATA_HOME=/workspace/.xdg-data
      - XDG_CACHE_HOME=/workspace/.xdg-cache
      - XDG_STATE_HOME=/workspace/.xdg-state
    volumes:
      - .:/workspace:cached

  frontend:
    build: *dev-image
    image: ${DEV_IMAGE:-distributed-task-queue-dev}
    profiles: ["dev"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["./scripts/frontend-dev.sh"]
    depends_on:
      - dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - API_PROXY=http://dev:8080
      - HOME=/home/devuser
      - npm_config_cache=/workspace/.xdg-cache/npm
    volumes:
      - .:/workspace:cached

volumes:
  pgdata:
