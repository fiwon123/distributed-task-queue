# Compose file for two independent stacks that share one Postgres (`db`):
#
#   development (profile: dev)  — `dev` sandbox (runs the API via air, fast
#                                 reload, host :8081) + `frontend` (Vite dev
#                                 server, host :5173) + a `worker`, so jobs flow
#                                 while you edit code. `make dev-up`.
#   production  (profile: prod) — `api` (runtime image, host :8080) plus a
#                                 `worker`. The real end-to-end app. `make prod-up`.
#
# Services select their stack by profile:
#   - `db`        — no profile; both stacks need it, and it is always started.
#   - `dev`       — profile `dev` only.
#   - `frontend`  — profile `dev` only; Vite dev server for the dashboard.
#   - `worker`    — profiles `dev` AND `prod`; it runs in either stack.
#   - `api`       — profile `prod` only.
#
# `docker compose up` with no profile now starts only `db`, because every app
# service is gated behind a profile. Use the Makefile targets (or pass
# `--profile dev` / `--profile prod`).
#
# Both stacks share the same `db` service and `pgdata` volume, so run one stack
# at a time — stopping a stack stops the shared database.
#
# - No docker socket (by design): the in-container agent cannot manage containers.
# - Host GitHub config is mounted read-only; tokens are forwarded at runtime via
#   `${GH_TOKEN:-}` / `${GITHUB_TOKEN:-}` — never baked into the image.
# - The Dockerfile creates `devuser` matching HOST_UID/HOST_GID (passed as build
#   args) so the image has a passwd entry + /home/devuser for the runtime user —
#   without it the shell greets the user with "I have no name!".
# - Go module/build caches live under /workspace/.go so the non-root user can
#   write them (GOPATH/GOCACHE default to root-owned /go).
# - opencode/gh runtime state goes under /workspace/.xdg-* (writable), while
#   config stays read-only at .../.config/{opencode,gh}.
#
# The `db` credentials are deliberately empty/trust: this is a throwaway local
# Postgres bound to localhost for development, never a deployed one. To avoid a
# port clash with a database already on the host, set POSTGRES_PORT.
name: distributed-task-queue

# The dev image is shared by two services: `dev` (the air sandbox + shell) and
# `frontend` (the Vite dev server). Defined once here so their build args cannot
# drift; both reference it with `build: *dev-image` and the same `image:` tag.
x-dev-image: &dev-image
  context: .
  dockerfile: Dockerfile
  target: dev
  args:
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=taskqueue
      - POSTGRES_DB=taskqueue
      # Local dev only: trust auth, no password. Never use this outside the sandbox.
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskqueue -d taskqueue"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- production stack (profile: prod) ----------------------------------------
  # Build the `runtime` stage: a minimal Alpine image with the api + worker
  # binaries. Both migrate on startup; migrations serialize on a Postgres
  # advisory lock, so running both concurrently is safe.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://taskqueue@db:5432/taskqueue?sslmode=disable
    ports:
      # Serves the HTTP API and the embedded dashboard. Override API_PORT if 8080
      # is taken on the host. (The dev sandbox uses HOST_PORT, a different var, so
      # the two can run side by side.)
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # Hits the API and the DB in one probe: /v1/queues queries the jobs table.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/queues"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Runs in BOTH stacks: in development it gives the air-reloaded API something
  # to hand jobs to; in production it is the app's worker. It only needs the
  # database (there is no `api` service in the dev stack), so it does not depend
  # on `api`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: ["dev", "prod"]
    # The runtime stage's ENTRYPOINT is the API; override it for the worker.
    entrypoint: ["/usr/local/bin/worker"]
    command:
      - "-queues"
      - "default"
      - "-concurrency"
      - "4"
      - "-poll-interval"
      - "500ms"
      - "-lease"
      - "30s"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://taskqueue@db:5432/taskqueue?sslmode=disable
    restart: unless-stopped

  # --- development stack (profile: dev) ----------------------------------------
  dev:
    build: *dev-image
    image: distributed-task-queue-dev
    profiles: ["dev"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["./scripts/dev-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host port only; the API listens on 8080 inside the container. Override
      # HOST_PORT so this sandbox and sibling projects can run at once — two
      # containers publishing the same host port means the second cannot program
      # its mapping and can be left with no network attachment, killing DNS.
      - "${HOST_PORT:-8081}:8080"
    environment:
      - DATABASE_URL=postgres://taskqueue@db:5432/taskqueue?sslmode=disable
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - HOME=/home/devuser
      - GOPATH=/workspace/.go
      - GOCACHE=/workspace/.go/cache
      - XDG_DATA_HOME=/workspace/.xdg-data
      - XDG_CACHE_HOME=/workspace/.xdg-cache
      - XDG_STATE_HOME=/workspace/.xdg-state
    volumes:
      - .:/workspace:cached
      - ${HOST_HOME:-${HOME}}/.config/gh:/home/devuser/.config/gh:ro
      - ${HOST_HOME:-${HOME}}/.opencode/bin/opencode:/usr/local/bin/opencode:ro
      - ${HOST_HOME:-${HOME}}/.config/opencode:/home/devuser/.config/opencode:ro
      - ${HOST_HOME:-${HOME}}/.gitconfig:/home/devuser/.gitconfig:ro

  # Vite dev server for the dashboard (profile: dev). Runs alongside the
  # air-reloaded API so `make dev-up` hot-reloads both the frontend (HMR) and the
  # backend. It proxies the API paths (see frontend/vite.config.ts), so the console
  # and the spec-driven Workbench work on the Vite origin.
  frontend:
    build: *dev-image
    image: distributed-task-queue-dev
    profiles: ["dev"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["./scripts/frontend-dev.sh"]
    # Start after the API container so logs interleave sensibly. Vite serves
    # immediately and proxies to the API once air has it listening.
    depends_on:
      - dev
    ports:
      # Vite dev server. Override FRONTEND_PORT if 5173 is taken on the host.
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite runs in this container, so it reaches the air API by service name.
      - API_PROXY=http://dev:8080
      - HOME=/home/devuser
      # Keep the npm cache on the shared (gitignored) workspace so recreating the
      # container does not re-download every dependency.
      - npm_config_cache=/workspace/.xdg-cache/npm
    volumes:
      - .:/workspace:cached

volumes:
  pgdata:
