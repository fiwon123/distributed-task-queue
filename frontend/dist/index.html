<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Console for Distributed Task Queue — a durable, PostgreSQL-backed distributed task queue."
    />
    <meta name="theme-color" content="#0d0a17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Distributed Task Queue · console</title>
    <script>
      // Stamp the resolved theme before first paint so there is no flash of the
      // wrong palette. Keep THEME_STORAGE_KEY in sync with frontend/src/theme.ts.
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem("dtq-theme");
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          theme = stored === "light" || stored === "dark" ? stored : light ? "light" : "dark";
        } catch (e) {
          theme = "dark";
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f7f4ff" : "#0d0a17");
      })();
    </script>
    <script type="module" crossorigin src="/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
